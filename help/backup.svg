  <rect x="70" y="135" width="1060" height="500" rx="12" fill="#17232d" stroke="#30404e"/><text x="100" y="175" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">バックアップ / 復元</text><rect x="100" y="215" width="480" height="300" rx="12" fill="#141f28" stroke="#2d3c48"/><text x="130" y="260" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">💾 バックアップ</text><text x="130" y="300" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#9aaab7">現在のデータを .uwp ファイル</text><text x="130" y="325" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#9aaab7">として保存します。</text><rect x="130" y="375" width="360" height="54" rx="10" fill="#315d86" stroke="#3f769f"/><text x="225" y="409" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">バックアップを保存</text><rect x="620" y="215" width="480" height="300" rx="12" fill="#141f28" stroke="#2d3c48"/><text x="650" y="260" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">♻️ 復元</text><text x="650" y="300" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#9aaab7">保存済みの .uwp ファイルを</text><text x="650" y="325" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#9aaab7">読み込んでデータを復元します。</text><rect x="650" y="375" width="360" height="54" rx="10" fill="#315d86" stroke="#3f769f"/><text x="750" y="409" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">バックアップを読み込む</text><text x="100" y="565" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e0b878">PC変更・ブラウザデータ削除などの前にバックアップしておくと安心です。</text>
