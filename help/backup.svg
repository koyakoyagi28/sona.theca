  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="34" y="28" width="1132" height="664" rx="18" fill="#111b24" stroke="#2b3a47"/>
  <rect x="34" y="28" width="1132" height="72" rx="18" fill="#17232d"/>
  <circle cx="72" cy="64" r="10" fill="#ef6b73"/><circle cx="104" cy="64" r="10" fill="#e5b85c"/><circle cx="136" cy="64" r="10" fill="#70c59b"/>
  <text x="170" y="70" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">バックアップ / 復元</text>
